name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mix-check:
    name: Elixir CI
    uses: dewetblomerus/actions-elixir/.github/workflows/elixir-ci.yml@main
    with:
      audit-command: mix deps.audit --ignore-advisory-ids GHSA-g2wm-735q-3f56
